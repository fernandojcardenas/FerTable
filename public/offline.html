<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · FerTable</title>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #677085; --accent: #3b5bdb; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12151b; --panel: #1a1e26; --text: #e6e9ef; --muted: #98a1b3; --accent: #7c96ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: var(--panel); border-radius: 14px; padding: 28px; max-width: 360px; text-align: center; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 20px; margin: 12px 0 6px; }
  p { color: var(--muted); margin: 0 0 18px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 18px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>FerTable needs a connection to load your bases. It will pick up where you left off once you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>addEventListener("online", () => location.reload());</script>
</body>
</html>
